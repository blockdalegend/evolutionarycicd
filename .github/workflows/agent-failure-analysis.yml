name: Agent - Failure Analysis

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  failure-analysis-agent:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start local Ollama model
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 5 \
            -o /tmp/ollama-install.sh https://ollama.com/install.sh
          for attempt in {1..5}; do
            if sh /tmp/ollama-install.sh; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep 5
          done
          ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:11434/api/tags && break
            sleep 1
          done
          ollama pull qwen2.5-coder:3b

      - name: Download CI test report
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: /tmp
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: Collect failure context
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          AGENT_ARTIFACT_DIR: /tmp
        run: python scripts/collect_pipeline_context.py > /tmp/context.json

      - name: Run Failure Analysis Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          AGENT_DRY_RUN: ${{ vars.AGENT_DRY_RUN || 'true' }}
          AGENT_LOG_LEVEL: INFO
          LLM_API_KEY: ollama
          LLM_BASE_URL: http://127.0.0.1:11434/v1
          LLM_MODEL: qwen2.5-coder:3b
          LLM_AUTH_MODE: bearer
          LLM_TIMEOUT_SECONDS: "300"
        run: python scripts/run_agent.py --agent failure_analysis --context-file /tmp/context.json
name: Agent - Pipeline Optimization (Evolutionary CI/CD)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read
  issues: write

jobs:
  pipeline-optimizer-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start local Ollama model
        run: |
          curl -fsSL -o /tmp/ollama-install.sh https://ollama.com/install.sh
          sh /tmp/ollama-install.sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:11434/api/tags && break
            sleep 1
          done
          ollama pull qwen2.5-coder:3b

      - name: Run Pipeline Optimizer Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          AGENT_DRY_RUN: ${{ vars.AGENT_DRY_RUN || 'true' }}
          AGENT_LOG_LEVEL: INFO
          LLM_API_KEY: ollama
          LLM_BASE_URL: http://127.0.0.1:11434/v1
          LLM_MODEL: qwen2.5-coder:3b
          LLM_AUTH_MODE: bearer
          LLM_TIMEOUT_SECONDS: "300"
        run: python scripts/run_agent.py --agent pipeline_optimizer

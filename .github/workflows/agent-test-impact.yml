name: Agent - Test Impact (Advisory)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to analyze
        required: true
        type: number
      dry_run:
        description: Keep issue publishing in dry-run mode
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions: {}

concurrency:
  group: test-impact-${{ github.event.pull_request.number || inputs.pull_request_number || github.run_id }}
  cancel-in-progress: true

jobs:
  advisory:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install trusted dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt

      - name: Collect PR evidence through GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          AGENT_HISTORY_MODE: none
        run: python scripts/collect_pipeline_context.py > /tmp/context.json

      - name: Run advisory analysis without GitHub writes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          AGENT_DRY_RUN: "true"
          AGENT_LOG_LEVEL: INFO
        run: python scripts/run_agent.py --agent test_impact --context-file /tmp/context.json --demo

      - name: Persist analysis telemetry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-telemetry
          path: data/agent_telemetry.ndjson
          if-no-files-found: ignore
          retention-days: 90

  trusted-dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install trusted dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt

      - name: Collect PR evidence through GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          AGENT_PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          AGENT_HISTORY_MODE: none
        run: python scripts/collect_pipeline_context.py > /tmp/context.json

      - name: Run policy-governed issue proposal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          AGENT_PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          AGENT_DRY_RUN: ${{ inputs.dry_run }}
          AGENT_LOG_LEVEL: INFO
        run: python scripts/run_agent.py --agent test_impact --context-file /tmp/context.json

      - name: Persist analysis telemetry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-telemetry
          path: data/agent_telemetry.ndjson
          if-no-files-found: ignore
          retention-days: 90
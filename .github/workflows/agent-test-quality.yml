name: Agent - Test Quality

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test-quality-agent:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate test and coverage reports
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --junitxml=junit.xml
        continue-on-error: true

      - name: Collect PR context
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          AGENT_ARTIFACT_DIR: ${{ github.workspace }}
        run: python scripts/collect_pipeline_context.py > /tmp/context.json

      - name: Run Test Quality Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          AGENT_DRY_RUN: ${{ vars.AGENT_DRY_RUN || 'true' }}
          AGENT_LOG_LEVEL: INFO
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_AUTH_MODE: ${{ vars.LLM_AUTH_MODE || 'bearer' }}
        run: python scripts/run_agent.py --agent test_quality --context-file /tmp/context.json

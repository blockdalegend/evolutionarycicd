name: Agent - Flaky Test Analysis

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] Trusted checkout; bounded JUnit is parsed as data, never executed.
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

permissions: {}

concurrency:
  group: flaky-test-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  analyze-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt

      - name: Collect bounded historical evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          AGENT_HISTORY_MODE: tests
        run: python scripts/collect_pipeline_context.py > /tmp/context.json

      - name: Run Flaky Test Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          AGENT_DRY_RUN: ${{ vars.AGENT_DRY_RUN || 'true' }}
          AGENT_LOG_LEVEL: INFO
        run: python scripts/run_agent.py --agent flaky_test --context-file /tmp/context.json

      - name: Persist run telemetry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-telemetry
          path: data/agent_telemetry.ndjson
          if-no-files-found: ignore
          retention-days: 90
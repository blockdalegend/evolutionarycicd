name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: mypy (typecheck)
        run: mypy app agents tools llm telemetry scripts

      - name: pytest with coverage
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml --junitxml=junit.xml

      - name: Bandit (security)
        run: bandit -r app agents tools llm telemetry scripts -q

      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit -r requirements.txt
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: junit.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

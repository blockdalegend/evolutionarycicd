name: Agent - Supply Chain Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  supply-chain-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start local Ollama model
        run: |
          curl -fsSL -o /tmp/ollama-install.sh https://ollama.com/install.sh
          sh /tmp/ollama-install.sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:11434/api/tags && break
            sleep 1
          done
          ollama pull qwen2.5-coder:7b

      - name: Bandit (security)
        run: bandit -r app agents tools llm telemetry scripts -q -f json -o /tmp/bandit.json
        continue-on-error: true

      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit -r requirements.txt -f json -o /tmp/pip-audit.json
        continue-on-error: true

      - name: Zizmor (GitHub Actions security)
        run: zizmor --format json .github/workflows > /tmp/zizmor.json
        continue-on-error: true

      - name: Collect PR context
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          AGENT_ARTIFACT_DIR: /tmp
        run: python scripts/collect_pipeline_context.py > /tmp/context.json

      - name: Run Supply Chain Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          AGENT_DRY_RUN: ${{ vars.AGENT_DRY_RUN || 'true' }}
          AGENT_LOG_LEVEL: INFO
          LLM_API_KEY: ollama
          LLM_BASE_URL: http://127.0.0.1:11434/v1
          LLM_MODEL: qwen2.5-coder:7b
          LLM_AUTH_MODE: bearer
        run: python scripts/run_agent.py --agent supply_chain --context-file /tmp/context.json
